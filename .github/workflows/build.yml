name: Build check

on:
  push:
    branches: [main, feature/shared-content-supabase]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed application modules
        run: >-
          bunx eslint
          src/components/content/ContentSectionPage.tsx
          src/components/admin/AdminBackendPanel.tsx
          src/components/admin/AdminContentManager.tsx
          src/components/admin/AdminGameQuestionManager.tsx
          src/lib/backend/games.ts
          src/lib/backend/games.test.ts
          src/lib/backend/quizzes.ts
          src/lib/backend/quizzes.test.ts
          src/lib/backend/student.ts
          src/lib/backend/student.test.ts
          src/lib/backend/teacher.ts
          src/lib/backend/validation.ts
          src/lib/backend/validation.test.ts
          src/lib/auth.tsx
          src/routes/auth.tsx
          src/routes/forgot-password.tsx
          src/routes/reset-password.tsx
          src/lib/content/shared-content.ts
          src/lib/nav.ts
          src/routes/games.tsx
      - name: Test application
        run: bun run test
      - name: Build application
        run: bun run build
