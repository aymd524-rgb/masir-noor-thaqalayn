name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/combined-auth-contact-privacy-2026-11-19, integration/institutes-phone-otp-2026-11-27]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test application
        run: bun run test
      - name: Build application
        run: bun run build
